services:
    postgres:
        image: postgres:15-alpine
        container_name: kite_postgres
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL","pg_isready -U kite_admin -d trading_platform"]
            interval: 5s
            timeout: 5s
            retries: 5
    redis:
        image: redis:7-alpine
        container_name: kite_redis
        restart: always
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: kite_rabbitmq
        restart: always
        ports:
            - "5672:5672"   # Main application port
            - "15672:15672" # Management UI port
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    postgres_data:
    redis_data:

        